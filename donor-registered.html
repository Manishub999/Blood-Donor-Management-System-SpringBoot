<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Complete</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body { background-color: #f8f9fa; font-family: 'Inter', sans-serif; }
        .success-card { max-width: 450px; margin-top: 100px; padding: 40px; border-radius: 15px; box-shadow: 0 4px 25px rgba(0, 0, 0, 0.1); }
        .checkmark { font-size: 3rem; color: #198754; }
        .text-lead { font-size: 1.15rem; color: #343a40; }
    </style>
</head>
<body class="d-flex justify-content-center">

    <div class="card border-0 success-card text-center">
        <div class="checkmark mx-auto mb-4"><i class="fas fa-check-circle"></i></div>
        
        <h2 class="text-success mb-3">Registration Successful!</h2>
        
        <p class="text-lead mb-4">
            Thank you for registering as a life-saving donor.
        </p>

        <div class="p-3 mb-4 bg-light text-start rounded">
            <h6 class="text-dark">What happens next:</h6>
            <ul class="small list-unstyled m-0">
                <li><i class="fas fa-bell me-2 text-danger"></i> We will now monitor for requests that match your blood type and city.</li>
                <li><i class="fas fa-envelope me-2 text-primary"></i> **You will receive an email alert** instantly when an emergency occurs.</li>
            </ul>
        </div>

        <a href="dashboard.html" class="btn btn-danger w-100">Go to Donor Dashboard</a>
    </div>

</body>
</html>
