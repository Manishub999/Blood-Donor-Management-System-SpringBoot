<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Submitted</title>
    <!-- Link to Bootstrap and your custom styles -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* A little extra style to match the other pages */
        body {
            background-color: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .success-card {
            max-width: 500px;
            text-align: center;
        }
        .success-icon {
            font-size: 4rem;
            color: #198754; /* Bootstrap success green */
        }
    </style>
</head>
<body>

    <div class="card p-4 p-md-5 shadow-sm success-card">
        <!-- You can find a checkmark icon or use an SVG -->
        <div class="success-icon mb-3">
            <!-- Simple SVG Checkmark -->
            <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="currentColor" class="bi bi-check-circle-fill" viewBox="0 0 16 16">
                <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zm-3.97-3.03a.75.75 0 0 0-1.08.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-.01-1.05z"/>
            </svg>
        </div>
        
        <h2 class="h4">Request Submitted!</h2>
        <p class="text-muted">Your emergency blood request has been sent to nearby donors and hospitals.</p>

        <div class="alert alert-success mt-3">
            <strong>What happens next:</strong>
            <ul class="text-start mb-0" style="padding-left: 1.2rem;">
                <li>Matching donors will be notified immediately.</li>
                <li>You'll receive responses via phone and email.</li>
            </ul>
        </div>

        <a href="dashboard.html" class="btn btn-danger mt-3">Return to Dashboard</a>
    </div>

</body>
</html>
