<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Blood</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body { background-color: #f8f9fa; font-family: 'Inter', sans-serif; }
        .card-custom { max-width: 600px; margin-top: 50px; padding: 40px; border-radius: 15px; box-shadow: 0 4px 25px rgba(0, 0, 0, 0.1); }
    </style>
</head>
<body class="d-flex justify-content-center">

    <div class="card bg-white border-0 card-custom">
        <h2 class="text-center text-danger mb-4">Urgent Blood Request</h2>
        <p class="text-muted text-center">Please provide accurate information for immediate donor alerts.</p>
        
        <form id="bloodRequestForm">
            <div class="mb-3">
                <label for="patientName" class="form-label">Patient Name (or contact name)</label>
                <input type="text" class="form-control" id="patientName" name="patientName" required>
            </div>
            
            <div class="mb-3">
                <label for="patientEmail" class="form-label">Patient/Contact Email Address</label>
                <input type="email" class="form-control" id="patientEmail" name="patientEmail" required>
            </div>
            
            <div class="mb-3">
                <label for="bloodGroup" class="form-label">Required Blood Group</label>
                <select class="form-select" id="bloodGroup" name="bloodGroup" required>
                    <option value="">Select...</option>
                    <option value="A+">A+</option><option value="A-">A-</option>
                    <option value="B+">B+</option><option value="B-">B-</option>
                    <option value="AB+">AB+</option><option value="AB-">AB-</option>
                    <option value="O+">O+</option><option value="O-">O-</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="city" class="form-label">City of Hospital</label>
                <input type="text" class="form-control" id="city" name="city" placeholder="Example: Mumbai" required>
            </div>
            <div class="mb-3">
                <label for="hospitalName" class="form-label">Hospital Name</label>
                <input type="text" class="form-control" id="hospitalName" name="hospitalName" required>
            </div>
            <div class="mb-3">
                <label for="contactPhone" class="form-label">Hospital/Contact Phone Number</label>
                <!-- FIX: Added placeholder to guide user to include country code -->
                <input type="tel" class="form-control" id="contactPhone" name="contactPhone" placeholder="+91 98765 43210" required>
                <div class="form-text">Please include your country code (e.g., +91 for India).</div>
            </div>
            <div class="mb-3">
                <label for="requiredBy" class="form-label">Required By (Date/Time)</label>
                <input type="datetime-local" class="form-control" id="requiredBy" name="requiredBy">
            </div>
            
            <button type="submit" class="btn btn-danger w-100 mt-3">Submit Urgent Request</button>
        </form>
    </div>

    <script src="main.js"></script>
</body>
</html>
