<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register as a Donor</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body { background-color: #f8f9fa; font-family: 'Inter', sans-serif; }
        .card-custom { max-width: 600px; margin-top: 50px; padding: 40px; border-radius: 15px; box-shadow: 0 4px 25px rgba(0, 0, 0, 0.1); }
        .checkbox-group { border: 1px solid #dee2e6; padding: 10px; border-radius: 5px; }
    </style>
</head>
<body class="d-flex justify-content-center">

    <div class="row justify-content-center">
        <div class="col-md-12">
            <div class="card p-4 shadow-lg border-0 card-custom">
                <h2 class="text-center text-danger mb-4">Register as a Donor</h2>
                <p class="text-muted text-center">Please provide your details to join the BloodConnect network.</p>
                
                <form id="requestForm">
                    <div class="mb-3">
                        <label for="name" class="form-label">Full Name</label>
                        <input type="text" class="form-control" id="name" name="name" required>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">Email Address</label>
                        <input type="email" class="form-control" id="email" name="email" required>
                    </div>

                    <div class="mb-3">
                        <label for="bloodGroup" class="form-label">Blood Group</label>
                        <select class="form-select" id="bloodGroup" name="bloodGroup" required>
                            <option value="">Select...</option>
                            <option value="A+">A+</option><option value="A-">A-</option>
                            <option value="B+">B+</option><option value="B-">B-</option>
                            <option value="AB+">AB+</option><option value="AB-">AB-</option>
                            <option value="O+">O+</option><option value="O-">O-</option>
                        </select>
                    </div>
                    
                    <!-- NEW FEATURE: Disease Screening Checkboxes -->
                    <div class="mb-3">
                        <label class="form-label">Pre-existing Conditions (Select all that apply)</label>
                        <div class="checkbox-group">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" value="HIV/AIDS" id="checkHIV" name="diseases">
                                <label class="form-check-label" for="checkHIV">HIV/AIDS</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" value="Hepatitis B/C" id="checkHepatitis" name="diseases">
                                <label class="form-check-label" for="checkHepatitis">Hepatitis B/C</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" value="Severe Anemia" id="checkAnemia" name="diseases">
                                <label class="form-check-label" for="checkAnemia">Severe Anemia</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" value="None" id="checkNone" name="diseases">
                                <label class="form-check-label" for="checkNone">None of the Above</label>
                            </div>
                        </div>
                        <div class="form-text">Selecting certain conditions may disqualify you from donating.</div>
                    </div>

                    <div class="mb-3">
                        <label for="city" class="form-label">City</label>
                        <input type="text" class="form-control" id="city" name="city" required>
                    </div>
                    <div class="mb-3">
                        <label for="contact" class="form-label">Contact Number</label>
                        <input type="tel" class="form-control" id="contact" name="contact" placeholder="+91 98765 43210" required>
                        <div class="form-text">Please include your country code (e.g., +91 for India).</div>
                    </div>
                    <button type="submit" class="btn btn-danger w-100 mt-3">Register Me</button>
                </form>
            </div>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
