# This file is used when running the application inside Docker.

# CRITICAL FIX: Change 'localhost' to 'host.docker.internal' 
# This tells the Docker container to look for the service (MySQL) on your host machine.
spring.datasource.url=jdbc:mysql://host.docker.internal:3306/blood_db

# Use your existing MySQL credentials
spring.datasource.username=root
spring.datasource.password=************

# Hibernate/JPA Settings (Copied from main application.properties)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
